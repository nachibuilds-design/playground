<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
:root{
  --paper:#efece6; --ink:#141414; --dim:rgba(20,20,20,.5); --line:rgba(20,20,20,.09); --hair:rgba(20,20,20,.22);
  --grad:conic-gradient(from 200deg,#ffb347,#ff8a3d 18%,#ff5a5f 34%,#ff3d8b 50%,#ff5a5f 66%,#ff8a3d 82%,#ffb347);
  --gradl:linear-gradient(100deg,#ffb347,#ff8a3d 28%,#ff5a5f 62%,#ff3d8b);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --col:17%; --nav:52px;
  --fs:clamp(64px,min(12vw,24vh),200px);
  --gap:clamp(8px,1.8vh,20px);
  --small:clamp(10px,1vw,12px);
  /* quote strip: font size and the fixed height reserved for it (label + 4 lines + author + padding) */
  --qfs:clamp(16px,min(1.6vw,2.6vh),28px);
  --qh:calc(var(--qfs)*5 + 48px + 3.5vh);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font-family:var(--mono);color:inherit;cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #ff5a5f;outline-offset:2px}
[hidden]{display:none!important}

/* grid guides */
.guides{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(var(--line),var(--line)) 17% 0/1px 100% no-repeat,
    linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat,
    linear-gradient(var(--line),var(--line)) 83% 0/1px 100% no-repeat}

/* canvases */
canvas#gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;display:block}
body.no-gl canvas#gl{display:none}
canvas#confetti{position:fixed;inset:0;z-index:9;pointer-events:none}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 var(--col);background:rgba(239,236,230,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
.logo{display:flex;align-items:center;gap:10px;font:500 18px/1 var(--sans);letter-spacing:.01em;white-space:nowrap}
.mark{position:relative;width:27px;height:27px;border-radius:7px;flex:none}
.mark::before{content:"";position:absolute;inset:0;border-radius:7px;padding:2px;background:var(--grad);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.mark::after{content:"";position:absolute;left:8px;top:10px;width:4px;height:4px;border-radius:50%;background:var(--ink);box-shadow:7px 0 0 var(--ink)}
.navr{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;height:30px;border:1px solid var(--ink)}
.seg button{height:100%;padding:0 12px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-right:1px solid var(--ink);transition:background .15s,color .15s}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.nbtn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--ink);font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:background .15s,color .15s}
.nbtn:hover{background:var(--ink);color:var(--paper)}
.nbtn svg{width:12px;height:12px;flex:none}
.nbtn.off .wave{display:none}

/* stage + content column */
.stage{position:fixed;top:var(--nav);left:0;right:0;bottom:0;z-index:3;pointer-events:none}
.col{position:absolute;left:var(--col);right:40%;top:0;bottom:var(--qh);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:var(--gap);padding:1.5vh 0 1vh;pointer-events:auto}
.eyebrow{display:flex;align-items:center;gap:10px;font:400 clamp(10px,1.1vw,12px)/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--ink)}

/* the big gradient-outlined time box, bottom-right corner cut at 45 degrees, interior transparent */
.timebox{position:relative;display:inline-flex;align-items:baseline;font-size:calc(var(--fs)*var(--ds,1));line-height:.95;font-weight:400;
  padding:.07em .17em .11em .14em;font-variant-numeric:tabular-nums;letter-spacing:-.01em;--k:18px}
.timebox::before{content:"";position:absolute;inset:0;padding:2px;pointer-events:none;background:var(--gradl);
  -webkit-mask:linear-gradient(135deg,#000 calc(100% - var(--k) + .83px),transparent 0) content-box,linear-gradient(135deg,#000 calc(100% - var(--k)),transparent 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(135deg,#000 calc(100% - var(--k) + .83px),transparent 0) content-box,linear-gradient(135deg,#000 calc(100% - var(--k)),transparent 0);
  mask-composite:exclude}
.digits{outline:none;cursor:text;min-width:2ch;white-space:nowrap;font-weight:400}
.digits:focus{color:#ff5a5f}
.timebox.clock .digits{cursor:default}
.secs{font-size:.32em;margin-left:.22em;font-weight:500;letter-spacing:0}
.hint,.dateline{font:400 var(--small)/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.dateline{color:var(--ink)}

/* progress bar */
.bar{position:relative;width:min(100%,34vw);height:3px}
.bar::before{content:"";position:absolute;left:0;right:0;top:1px;height:1px;background:var(--hair)}
.fill{position:absolute;left:0;top:0;height:3px;width:100%;background:var(--gradl);transition:width .25s linear}

/* mono prompt box */
.prompt{width:min(100%,34vw)}
.ptab{width:34px;height:34px;border:1px solid var(--ink);border-bottom:0;display:grid;place-items:center;font:700 26px/1 Georgia,"Times New Roman",serif;padding-top:10px}
.pbox{position:relative;border:1px solid var(--ink);padding:10px 14px;font:400 var(--small)/1.45 var(--mono);text-transform:uppercase;letter-spacing:.05em;min-height:calc(2*1.45em + 20px)}
.pbox i{position:absolute;width:7px;height:7px;border:1px solid var(--ink)}
.pbox .tl{left:-8px;top:-8px;border-right:0;border-bottom:0;border-top-left-radius:2px}
.pbox .tr{right:-8px;top:-8px;border-left:0;border-bottom:0;border-top-right-radius:2px}
.pbox .bl{left:-8px;bottom:-8px;border-right:0;border-top:0;border-bottom-left-radius:2px}
.pbox .br{right:-8px;bottom:-8px;border-left:0;border-top:0;border-bottom-right-radius:2px}
.caret{display:inline-block;width:6px;height:11px;background:var(--ink);margin-left:3px;vertical-align:-1px;animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}

/* controls */
.controls{display:flex;flex-direction:column;gap:calc(var(--gap)*.6);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lab{font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);min-width:44px}
.chip{height:clamp(26px,3.8vh,32px);padding:0 clamp(9px,1vw,14px);border:1px solid var(--ink);font:500 var(--small) var(--mono);letter-spacing:.06em;text-transform:uppercase;transition:background .15s,color .15s}
.chip:hover,.chip.on{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:10px;align-items:center;margin-top:2px}
.go,.reset{height:clamp(44px,6.5vh,56px);border:1px solid var(--ink);font:500 clamp(12px,1.1vw,14px) var(--mono);letter-spacing:.1em;text-transform:uppercase;transition:background .15s,color .15s}
.go{position:relative;min-width:clamp(150px,16vw,220px);padding:0 28px}
.go::before{content:"";position:absolute;inset:-1px;background:var(--gradl);clip-path:polygon(0 0,62% 0,62% 2px,2px 2px,2px 100%,0 100%);pointer-events:none}
.go:hover,.reset:hover{background:var(--ink);color:var(--paper)}
.go.pause{background:var(--ink);color:var(--paper)}
.go.pause::before{display:none}
.reset{padding:0 22px}
.keys{font:400 clamp(9px,.9vw,11px)/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}

/* quote of the moment: a fixed-height strip along the bottom of the content column, never past the 50% guide */
.quote{position:absolute;left:var(--col);right:50%;bottom:0;height:var(--qh);margin:0;padding:0 0 clamp(10px,2vh,26px);
  display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(6px,1vh,12px);pointer-events:none;overflow:hidden}
.quote::before{content:"";flex:none;width:min(100%,160px);height:1px;background:var(--gradl);opacity:.9;margin-bottom:clamp(2px,.6vh,8px)}
.qlab{display:flex;align-items:center;gap:10px;font:400 var(--small)/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.qlab::before{content:"";width:22px;height:1px;background:var(--ink)}
.qf{display:flex;flex-direction:column;gap:clamp(6px,1vh,12px);transition:opacity .45s ease,transform .45s ease}
.qf.out{opacity:0;transform:translateY(6px)}
.quote blockquote{font:400 var(--qfs)/1.25 var(--sans);color:var(--ink);letter-spacing:-.005em;text-wrap:pretty;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;max-height:calc(var(--qfs)*1.25*5)}
.quote figcaption{display:flex;align-items:center;gap:8px;font:400 var(--small)/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.quote figcaption::before{content:"";width:14px;height:1px;background:var(--hair)}

/* mobile */
@media (max-width:900px){
  :root{--col:16px}
  .guides{background:linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat}
  .col{left:16px;right:16px;bottom:var(--qh);justify-content:flex-end;padding-bottom:10px}
  .bar,.prompt{width:100%}
  .eyebrow,.timebox,.hint,.dateline,.ptab,.pbox,.chip,.go,.reset,.keys,.chips .lab{background:rgba(239,236,230,.88)}
  .chip.on,.chip:hover,.go.pause,.go:hover,.reset:hover{background:var(--ink)}
  /* quote sits compactly below the controls, full width, on paper backing (the robot stands behind the content on phones) */
  :root{--qfs:16px;--qh:calc(16px*5 + 48px + 12px + max(0px,env(safe-area-inset-bottom)))}
  .quote{left:0;right:0;padding:8px 16px max(12px,env(safe-area-inset-bottom));gap:6px;background:rgba(239,236,230,.88)}
  .quote::before{margin-bottom:2px}
  .qf{gap:6px}
  .quote blockquote{-webkit-line-clamp:4;max-height:calc(16px*1.25*4)}
}
/* portrait phones: tighter vertical rhythm (vh-aware) so the column plus the quote strip fits below the robot,
   which the resize handler frames into the band between the nav and the top of the column */
@media (max-width:900px) and (orientation:portrait){
  :root{--gap:clamp(6px,1.2vh,14px)}
  .col{padding:1vh 0 clamp(4px,1vh,10px)}
  .ptab{width:30px;height:clamp(24px,3.4vh,30px);font-size:clamp(20px,2.8vh,24px);padding-top:clamp(5px,1vh,8px)}
  .pbox{padding:clamp(6px,1vh,10px) 12px;min-height:calc(2*1.45em + 2*clamp(6px,1vh,10px))}
  .controls{gap:clamp(4px,.7vh,8px)}
  .chips{gap:5px}
  .chip{height:clamp(24px,3.4vh,30px);padding:0 9px}
  .row{margin-top:0}
  .go,.reset{height:clamp(38px,5.2vh,48px)}
  .keys{font-size:9px}
}
@media (max-width:900px) and (orientation:portrait) and (max-height:700px){
  :root{--fs:clamp(56px,min(12vw,9vh),200px)}  /* short phones: smaller digits, no quote tab, no keyboard hint */
  .ptab,.keys{display:none}
}
@media (max-width:600px){
  .nbtn span{display:none}
  .nbtn{width:30px;padding:0;justify-content:center}
  .logo{font-size:16px}
  .seg button{padding:0 10px}
}
@media (min-width:901px) and (max-height:760px){
  :root{--gap:clamp(6px,1.4vh,20px)}  /* projector heights: keep the column comfortable above the quote strip */
}
@media (max-height:520px){
  :root{--fs:clamp(44px,18vh,120px);--gap:6px}
  .ptab{display:none}
}
@media (prefers-reduced-motion:reduce){
  .caret{animation:none}
  .fill,.chip,.go,.reset,.nbtn{transition:none}
  .qf{transition:opacity .45s ease}
  .qf.out{transform:none}
}
@media (max-width:380px){.nav{gap:6px}.logo{font-size:15px;gap:7px}.seg button{padding:0 8px}}
</style>
</head>
<body>
<div class="guides" aria-hidden="true"></div>
<canvas id="gl" aria-hidden="true"></canvas>

<header class="nav">
  <div class="logo"><span class="mark" aria-hidden="true"></span><span>HAPPY TIMER</span></div>
  <div class="navr">
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" data-mode="timer" aria-pressed="true" aria-label="Timer mode">Timer</button>
      <button type="button" data-mode="clock" aria-pressed="false" aria-label="Clock mode">Clock</button>
    </div>
    <button type="button" class="nbtn" id="sound" aria-label="Toggle sound" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6"/></svg>
      <span>Sound on</span>
    </button>
    <button type="button" class="nbtn" id="full" aria-label="Toggle fullscreen" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      <span>Fullscreen</span>
    </button>
  </div>
</header>

<main class="stage">
  <div class="col" id="col">
    <div class="eyebrow" id="eyebrow">Stay on track</div>

    <div class="timebox" id="timebox">
      <div class="digits" id="digits" role="timer" aria-live="off" aria-label="Time, click to edit" contenteditable="true" spellcheck="false">05:00</div>
      <span class="secs" id="secs" hidden>00</span>
    </div>
    <div class="hint" id="hint">Click the time to type one</div>
    <div class="dateline" id="dateline" hidden></div>

    <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>

    <div class="prompt">
      <div class="ptab" aria-hidden="true">&ldquo;</div>
      <div class="pbox" aria-live="polite"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><span id="msg"></span><span class="caret" aria-hidden="true"></span></div>
    </div>

    <div class="controls" id="controls">
      <div class="chips">
        <span class="lab">Preset</span>
        <button type="button" class="chip" data-set="60" aria-label="Set 1 minute">1 min</button>
        <button type="button" class="chip" data-set="300" aria-label="Set 5 minutes">5 min</button>
        <button type="button" class="chip" data-set="600" aria-label="Set 10 minutes">10 min</button>
        <button type="button" class="chip" data-set="900" aria-label="Set 15 minutes">15 min</button>
        <button type="button" class="chip" data-set="1800" aria-label="Set 30 minutes">30 min</button>
      </div>
      <div class="chips">
        <span class="lab">Add</span>
        <button type="button" class="chip" data-add="30" aria-label="Add 30 seconds">+0:30</button>
        <button type="button" class="chip" data-add="60" aria-label="Add 1 minute">+1:00</button>
        <button type="button" class="chip" data-add="300" aria-label="Add 5 minutes">+5:00</button>
      </div>
      <div class="row">
        <button type="button" class="go" id="go" aria-label="Start or pause the timer">Start</button>
        <button type="button" class="reset" id="reset" aria-label="Reset the timer">Reset</button>
      </div>
    </div>

    <div class="keys" id="keys">Space start / pause &middot; R reset &middot; F fullscreen</div>
  </div>

  <figure class="quote" id="quote" aria-live="off">
    <div class="qlab" aria-hidden="true">Quote of the moment</div>
    <div class="qf" id="qf">
      <blockquote id="qtext"></blockquote>
      <figcaption id="qauthor"></figcaption>
    </div>
  </figure>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>

<script type="module">
/* Happy Timer: one screen, timer + clock, with a three.js robot companion. */
const $ = s => document.querySelector(s);
const digits = $('#digits'), timebox = $('#timebox'), secsEl = $('#secs'), hint = $('#hint'),
  dateline = $('#dateline'), fill = $('#fill'), msgEl = $('#msg'), go = $('#go'), controls = $('#controls'),
  col = $('#col'), soundBtn = $('#sound'), fullBtn = $('#full'), eyebrow = $('#eyebrow'), keys = $('#keys');

// ---------- state
let mode = 'timer', total = 300, left = 300, running = false, done = false, soundOn = true, mood = 'idle';
let msgTimer = 0, typeTimer = 0, lastNow = 0, lastClock = 0, lastDigits = '', faceLabel = '';
let robot = null;

const cheer = [
  'You are doing great, keep going', 'Steady focus, one step at a time', 'Nice pace, stay with it',
  'Focus mode is on', 'Small steps add up to big things', 'Sip some water and carry on',
  'Looking good, keep it up', 'Deep breath, you have got this'];
const hurry = ['One minute left, wrap it up', 'Final stretch, finish strong', 'Last minute, bring it home'];
const yay = ['Time is up, great work', 'Done and dusted, well played', 'You made it, take a bow'];
const clockLines = ['Nice time to be here', 'Hope your day is going well', 'Take a breath and look around',
  'Every minute is a fresh start', 'Good company makes time fly'];
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- helpers
function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function parse(txt) {
  const p = txt.replace(/[^\d:]/g, '').split(':').filter(x => x !== '').map(Number);
  if (!p.length) return null;
  const v = p.length === 1 ? p[0] * 60 : p.reduce((a, x) => a * 60 + x, 0);  // "10" means 10 minutes
  return v > 0 ? Math.min(v, 99 * 3600 + 59 * 60 + 59) : null;
}
function pad2(n) { return String(n).padStart(2, '0'); }

// typed-out messages, about 32ms per character
function say(text) {
  clearTimeout(typeTimer); msgEl.textContent = '';
  let i = 0;
  const step = () => { i++; msgEl.textContent = text.slice(0, i); if (i < text.length) typeTimer = setTimeout(step, 32); };
  typeTimer = setTimeout(step, 150);
}

// shrink the digits if the box would overflow the column (e.g. "1:00:00")
function fitDigits() {
  timebox.style.setProperty('--ds', '1');
  const avail = col.clientWidth, w = timebox.offsetWidth;
  if (w > avail && w > 0) timebox.style.setProperty('--ds', (avail / w * .98).toFixed(3));
}

function computeMood() {
  if (mode === 'clock') return 'clock';
  if (done) return 'happy';
  if (running) return (left <= 60 && left > 0) ? 'worry' : 'running';
  return 'idle';
}

// ---------- rendering
function renderTimer() {
  const txt = fmt(left);
  if (document.activeElement !== digits && digits.textContent !== txt) {
    const lenChanged = txt.length !== lastDigits.length;
    digits.textContent = txt; lastDigits = txt;
    if (lenChanged) fitDigits();
  }
  faceLabel = txt;
  fill.style.width = (total ? Math.max(0, Math.min(1, left / total)) * 100 : 0) + '%';
  document.title = (running ? txt + ' · ' : '') + 'Happy Timer';
  document.querySelectorAll('[data-set]').forEach(b => b.classList.toggle('on', +b.dataset.set === total));
}
function renderClock(now) {
  if (now - lastClock < 250) return;
  lastClock = now;
  const d = new Date();
  const t = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  if (digits.textContent !== t) digits.textContent = t;
  secsEl.textContent = pad2(d.getSeconds());
  faceLabel = t;
  fill.style.width = ((d.getSeconds() + d.getMilliseconds() / 1000) / 60 * 100) + '%';
  const wd = d.toLocaleDateString(undefined, { weekday: 'long' });
  const dt = d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  const line = wd + ' · ' + dt;
  if (dateline.textContent !== line) dateline.textContent = line;
}

// ---------- timer control
function scheduleCheer() {
  clearInterval(msgTimer);
  msgTimer = setInterval(() => {
    if (mode === 'timer' && running && left > 60) say(pick(cheer));
    else if (mode === 'clock') say(pick(clockLines));
  }, 45000);
}
function start() {
  if (mode !== 'timer' || left <= 0 || running) return;
  running = true; done = false;
  go.textContent = 'Pause'; go.classList.add('pause'); hint.hidden = true;
  say(pick(cheer)); scheduleCheer(); renderTimer();
}
function pause() {
  if (!running) return;
  running = false; clearInterval(msgTimer);
  go.textContent = 'Resume'; go.classList.remove('pause');
  say('Taking a short breather'); renderTimer();
}
function reset() {
  running = false; done = false; clearInterval(msgTimer);
  left = total;
  go.textContent = 'Start'; go.classList.remove('pause');

    if (actx.state === 'suspended') actx.resume();
    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.16;

    x: ox + (Math.random() - .5) * r.width * .6, y: oy,

  try {
    const [THREE, { RoundedBoxGeometry }, { RoomEnvironment }] = await Promise.all([
      import('three'),
      import('three/addons/geometries/RoundedBoxGeometry.js'),
      import('three/addons/environments/RoomEnvironment.js')

    robot = buildRobot(THREE, RoundedBoxGeometry, RoomEnvironment);

    fx.lineCap = 'round'; fx.lineJoin = 'round';
    if (qa > 0) {
      fx.globalAlpha = alpha * qa; fx.textAlign = 'center'; fx.textBaseline = 'middle';
      fx.font = '560px "Arial Black", "Arial Bold", Arial, sans-serif';
      fx.fillText('“', 256, 400);
      if (qa >= 1) { fx.globalAlpha = 1; return; }
    }
    alpha *= 1 - qa;
    fx.globalAlpha = alpha;
    const eye = (x, y, rx, ry) => { fx.beginPath(); fx.ellipse(x, y, rx, Math.max(2.5, ry * sq), 0, 0, Math.PI * 2); fx.fill(); };
    const arc = (x, y, r, a0, a1, lw) => { fx.lineWidth = lw; fx.beginPath(); fx.arc(x, y, r, a0, a1); fx.stroke(); };
    if (m === 'happy') {
      arc(196, 284, 36, Math.PI * 1.15, Math.PI * 1.85, 11);                    // ^ ^ closed happy eyes
      arc(316, 274, 36, Math.PI * 1.15, Math.PI * 1.85, 11);
      arc(256, 340, 62, Math.PI * .15, Math.PI * .85, 10);                      // smile
    } else if (m === 'worry') {
      eye(188, 266, 33, 46); eye(324, 256, 33, 46);                             // wider, taller, slightly apart
      fx.lineWidth = 8; fx.beginPath();                                         // worried brows, inner ends raised
      fx.moveTo(158, 198); fx.lineTo(222, 184); fx.moveTo(290, 174); fx.lineTo(354, 188); fx.stroke();
      const ph = (t * 1.1) % 1, x = 412, y = 150 + ph * 36;                     // sweat drop sliding down
      fx.globalAlpha = alpha * (1 - ph * .7);
      fx.beginPath(); fx.moveTo(x, y - 26);
      fx.bezierCurveTo(x + 20, y + 2, x + 15, y + 20, x, y + 20);
      fx.bezierCurveTo(x - 15, y + 20, x - 20, y + 2, x, y - 26); fx.fill();
      fx.globalAlpha = alpha;
    } else {
      eye(196, 262, 30, 38); eye(316, 252, 30, 38);                             // normal eyes
      if (m === 'clock') arc(256, 338, 34, Math.PI * .2, Math.PI * .8, 8);       // content little smile
    }
    // the time text goes before the eyes do, so it is never on screen together with the quote mark
    if (label && m !== 'happy' && qa < .5) {
      fx.globalAlpha = alpha * (1 - qa * 2);
      fx.shadowBlur = 10; fx.textAlign = 'center'; fx.textBaseline = 'middle';
      fx.font = `500 ${m === 'clock' ? 34 : 40}px "IBM Plex Mono", ui-monospace, Menlo, monospace`;
      fx.fillText(label, 256, m === 'clock' ? 425 : 400);
    }
    fx.globalAlpha = 1;
  }

  // ---------- motion state
  const POSES = {
    idle:    { speed: 1,    bob: .02,  hop: 0, wave: 0, worry: 0, arm: 1 },
    running: { speed: 1.35, bob: .03,  hop: 0, wave: 0, worry: 0, arm: 1.6 },
    worry:   { speed: 2,    bob: .035, hop: 0, wave: 0, worry: 1, arm: 1.7 },
    happy:   { speed: 1.2,  bob: .02,  hop: 1, wave: 1, worry: 0, arm: 1 },
    clock:   { speed: .9,   bob: .02,  hop: 0, wave: 0, worry: 0, arm: 1 }
  };
  const pose = { ...POSES.idle };
  const ptrT = { x: 0, y: 0 }, ptr = { x: 0, y: 0 };
  const onPointer = (px, py) => { ptrT.x = (px / innerWidth) * 2 - 1; ptrT.y = -((py / innerHeight) * 2 - 1); };
  window.addEventListener('pointermove', e => onPointer(e.clientX, e.clientY), { passive: true });
  window.addEventListener('touchmove', e => { if (e.touches[0]) onPointer(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

  let phase = 0, nextBlink = 3 + Math.random() * 3, blinkStart = -1, lastMood = '', faceA = 1;
  let quoteAt = -1;                                  // start time of the quote-mark flash, -1 when off
  const QUOTE_DUR = 1.4, QUOTE_RAMP = .3;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // camera framing: robot on the right (about 62 to 83 percent) on desktop; on portrait phones the whole robot,
  // pedestal included, is fitted into the band between the nav and the top of the content column
  const TAN15 = Math.tan(THREE.MathUtils.degToRad(15));
  const probe = new THREE.PerspectiveCamera(30, 1, .1, 100), pv = new THREE.Vector3();
  const TOP = new THREE.Vector3(0, 2.32, .7), BOTTOM = new THREE.Vector3(0, -3.02, .85); // head top, pedestal front bottom edge
  function screenY(p, lookY, z, h) {
    probe.position.set(0, lookY + .5, z); probe.lookAt(0, lookY, 0); probe.updateMatrixWorld();
    pv.copy(p).project(probe);
    return (1 - pv.y) / 2 * h;
  }
  // the band is measured against the tallest timer layout (hint shown), so stopping a timer never pushes text into the robot
  function contentBand() {
    const navB = $('.nav').getBoundingClientRect().bottom, hintWas = hint.hidden;
    if (mode === 'timer') hint.hidden = false;
    let top = Infinity;
    for (const el of col.children) {
      const r = el.getBoundingClientRect();
      if (r.height > 0) top = Math.min(top, r.top);
    }
    hint.hidden = hintWas;
    if (!isFinite(top)) top = col.getBoundingClientRect().bottom;
    return { top: navB + 6, bottom: Math.max(navB + 60, top - 12) };
  }
  function fitBand(w, h) {
    const band = contentBand();
    probe.aspect = w / h; probe.updateProjectionMatrix();
    let ppu = (band.bottom - band.top) / 5.4, lookY = -3.8, z = 27;  // pixels per world unit, first guess
    for (let i = 0; i < 4; i++) {
      z = h / (2 * ppu * TAN15);
      const yt = screenY(TOP, lookY, z, h), yb = screenY(BOTTOM, lookY, z, h);
      ppu *= (band.bottom - band.top) / (yb - yt);
      lookY += (band.top - yt) / ppu;
    }
    return { z: h / (2 * ppu * TAN15), lookY };
  }
  function framing() {
    const w = innerWidth, h = innerHeight, aspect = w / h;
    const mobile = w <= 900 && aspect < 1;
    let z = mobile ? 27 : 12.5, lookY = mobile ? -3.8 : -.38, fx = mobile ? .5 : .715;
    if (!mobile && aspect < 1.1) z *= 1.1 / aspect;
    if (mobile) ({ z, lookY } = fitBand(w, h));
    const halfW = z * TAN15 * aspect;
    return { x: -(fx - .5) * 2 * halfW, z, lookY };
  }
  const frameT = framing(), fr = { ...frameT };

  function resize() {
    renderer.setSize(innerWidth, innerHeight);
    cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
    Object.assign(frameT, framing());
  }

  function update(dt, t, moodName, label) {
    const tgt = POSES[moodName] || POSES.idle;
    const k = 1 - Math.exp(-dt * 4);
    for (const key in tgt) pose[key] += (tgt[key] - pose[key]) * k;
    ptr.x += (ptrT.x - ptr.x) * .06; ptr.y += (ptrT.y - ptr.y) * .06;
    const kf = 1 - Math.exp(-dt * 6);
    fr.x += (frameT.x - fr.x) * kf; fr.z += (frameT.z - fr.z) * kf; fr.lookY += (frameT.lookY - fr.lookY) * kf;

    phase += dt * pose.speed;
    const motion = reduced ? .35 : 1;
    const worry = pose.worry * motion;

    // body: bob, hop, yaw toward the content, worried sway
    robot.position.y = Math.sin(1.4 * phase) * pose.bob * motion + pose.hop * Math.abs(Math.sin(t * 6)) * .25 * motion;
    robot.rotation.y = -.22 + ptr.x * .12 + Math.sin(phase * 2.8) * .05 * worry;
    robot.rotation.z = Math.sin(phase * 2.8) * .03 * worry;

    // head: tilt, pointer follow, idle sway
    head.rotation.y = -.26 + ptr.x * .45 + Math.sin(t * 5.3) * .05 * worry;
    head.rotation.x = .05 - ptr.y * .18 + Math.sin(.9 * phase) * .02 + pose.hop * -.08;
    head.rotation.z = .08 + Math.sin(.7 * phase) * .02 - worry * .06;

    // arms: gentle swing, right arm waves when happy
    for (const { sh, fa, side } of arms) {
      const sw = Math.sin(1.4 * phase + side) * pose.arm * motion;
      sh.rotation.x = sw * .05;
      const waving = side > 0 ? pose.wave : 0;
      sh.rotation.z = side * .16 + waving * 2.45;
      fa.rotation.x = (-.35 + sw * .06) * (1 - waving);
      fa.rotation.z = Math.sin(t * 9) * .5 * waving;
    }

    // camera
    cam.position.set(fr.x + ptr.x * .25, fr.lookY + .5 - ptr.y * .1, fr.z);
    cam.lookAt(fr.x, fr.lookY, 0);

    // face: blink, mood fade, redraw every frame
    let sq = 1;
    if (blinkStart < 0 && t > nextBlink) blinkStart = t;
    if (blinkStart >= 0) {
      const p = (t - blinkStart) / .18;
      if (p >= 1) { blinkStart = -1; nextBlink = t + 2.5 + Math.random() * 3; }
      else sq = 1 - .9 * Math.sin(Math.PI * p);
    }
    if (moodName !== lastMood) { lastMood = moodName; faceA = 0; }
    faceA = Math.min(1, faceA + .05);
    // quote-mark flash: 1.4s envelope with soft ramps, dropped at once if a happy or worry face takes over
    let qa = 0;
    if (quoteAt >= 0) {
      const e = t - quoteAt;
      if (e >= QUOTE_DUR || moodName === 'happy' || moodName === 'worry') quoteAt = -1;
      else {
        const r = e < QUOTE_RAMP ? e / QUOTE_RAMP : e > QUOTE_DUR - QUOTE_RAMP ? (QUOTE_DUR - e) / QUOTE_RAMP : 1;
        qa = r * r * (3 - 2 * r);
      }
    }
    drawFace(moodName, sq, t, label, faceA, qa);
    faceTex.needsUpdate = true;

    renderer.render(scene, cam);
  }

  // called when a new quote appears; the loop's t is performance.now()/1000, same clock as here
  function quote() {
    if (lastMood === 'happy' || lastMood === 'worry') return;
    quoteAt = performance.now() / 1000;
  }

  resize();
  return { update, resize, quote };
}
</script>
</body>
